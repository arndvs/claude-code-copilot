name: "Agent: Update Branch"

on:
  # pull_request_target rather than pull_request: the standard pull_request
  # trigger depends on a generated merge commit, which GitHub fails to
  # produce when the PR is out-of-date or conflicting — exactly when this
  # workflow needs to run. pull_request_target runs in the base context and
  # does not need the merge commit, so the labeled event fires reliably.
  pull_request_target:
    types: [labeled]

jobs:
  refuse-fork:
    if: github.event.label.name == 'agent:update-branch' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Block unsafe fork execution
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" -R ${{ github.repository }} || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" -R ${{ github.repository }} || true
          gh pr comment "$PR_NUMBER" -R ${{ github.repository }} --body "Refused to run \`agent:update-branch\`: this workflow uses \`pull_request_target\` and cannot safely execute agent code for fork PRs. Recreate the PR from a branch in this repository, or update the branch manually."

  refuse-non-owner:
    if: github.event.label.name == 'agent:update-branch' && github.event.pull_request.head.repo.full_name == github.repository && !contains(fromJSON('["OWNER","MEMBER"]'), github.event.sender.type)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Block non-owner execution
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" -R ${{ github.repository }} || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" -R ${{ github.repository }} || true
          gh pr comment "$PR_NUMBER" -R ${{ github.repository }} --body "Refused to run \`agent:update-branch\`: only repository OWNER or MEMBER can trigger this workflow. Re-apply the label from an authorized account."

  update-branch:
    if: github.event.label.name == 'agent:update-branch' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sandcastle-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Fetch PR head sandcastle.config.json
        id: fetch-pr-head-config
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${{ github.repository }}/contents/sandcastle.config.json?ref=${{ env.BRANCH_HEAD_SHA }}" \
            > "$RUNNER_TEMP/pr-head-sandcastle.config.json" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/pr-head-sandcastle.config.json" ]; then
            echo "config_path=$RUNNER_TEMP/pr-head-sandcastle.config.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Proxy preflight
        id: proxy-preflight
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Only point preflight at the PR-head config when the fetch step
          # actually produced one; otherwise leave SANDCASTLE_CONFIG_PATH unset
          # so preflight falls back to the checked-out dev config.
          if [ -n "${{ steps.fetch-pr-head-config.outputs.config_path }}" ]; then
            export SANDCASTLE_CONFIG_PATH="${{ steps.fetch-pr-head-config.outputs.config_path }}"
          fi
          bash .sandcastle/scripts/proxy_preflight.sh

      - name: Sandcastle setup
        uses: ./.github/actions/sandcastle-setup
        with:
          trigger-label: agent:update-branch
          object-type: pr
          object-number: ${{ env.PR_NUMBER }}
          checkout-ref: ${{ github.event.pull_request.head.sha }}
          checkout-fetch-depth: 0
          skip-checkout: ${{ steps.proxy-preflight.outputs.should_run != 'true' }}
          install-engine: ${{ steps.proxy-preflight.outputs.should_run }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Stop when proxy preflight skips
        if: steps.proxy-preflight.outputs.should_run != 'true'
        env:
          PREFLIGHT_REASON: ${{ steps.proxy-preflight.outputs.reason }}
          PREFLIGHT_DETAIL: ${{ steps.proxy-preflight.outputs.detail }}
        run: |
          echo "Proxy preflight skipped agent run: ${PREFLIGHT_REASON}. ${PREFLIGHT_DETAIL}" > "${RUNNER_TEMP}/failure_reason.txt"
          exit 1

      - name: Ensure branch is checked out by name
        if: steps.proxy-preflight.outputs.should_run == 'true'
        run: git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"

      - name: Configure git identity
        if: steps.proxy-preflight.outputs.should_run == 'true'
        run: |
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"

      - name: Run update-branch
        if: steps.proxy-preflight.outputs.should_run == 'true'
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts update-branch \
            --pr "$PR_NUMBER" \
            --branch "$BRANCH" \
            --base-ref "$BASE_REF"

      - name: Push branch (abort cleanly if non-fast-forward)
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          SHOULD_PUSH_FILE: ${{ runner.temp }}/should_push.txt
        run: |
          if [ ! -f "$SHOULD_PUSH_FILE" ] || [ "$(cat "$SHOULD_PUSH_FILE")" != "true" ]; then
            echo "Nothing to push."
            exit 0
          fi
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during update-branch run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post PR comment
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: |
          if [ -f "$COMMENT_FILE" ]; then
            gh pr comment "$PR_NUMBER" -R ${{ github.repository }} --body-file "$COMMENT_FILE"
          fi

      - name: Restore workflow actions
        if: always()
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Sandcastle teardown
        if: always()
        uses: ./.github/actions/sandcastle-teardown
        with:
          trigger-label: agent:update-branch
          object-type: pr
          object-number: ${{ env.PR_NUMBER }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          job-status: ${{ job.status }}
