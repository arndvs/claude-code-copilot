name: "Agent: Implement PRD"

on:
  issues:
    types: [labeled]

jobs:
  implement-prd:
    if: github.event.label.name == 'agent:implement-prd'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sandcastle-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      PRD_NUMBER: ${{ github.event.issue.number }}
      PRD_TITLE: ${{ github.event.issue.title }}
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Detect — sub-issues + parent shape
        id: shape
        run: |
          set -euo pipefail
          sub_issues_json=$(gh api "repos/${GH_REPO}/issues/${PRD_NUMBER}/sub_issues" 2>/dev/null || echo "[]")
          sub_count=$(echo "$sub_issues_json" | jq 'length')
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          parent_number=$(gh api graphql \
            -f query='query($owner: String!, $repo: String!, $num: Int!) { repository(owner: $owner, name: $repo) { issue(number: $num) { parent { number } } } }' \
            -f owner="$owner" -f repo="$repo" -F num="$PRD_NUMBER" \
            --jq '.data.repository.issue.parent.number // empty' 2>/dev/null || echo "")

          # Reject nested PRDs: a PRD with sub-issues that itself has a parent.
          nested="false"
          if [ "$sub_count" != "0" ] && [ -n "$parent_number" ]; then
            nested="true"
          fi

          # Reject if any sub-issue has its own sub-issues (v1 is flat-only).
          has_nested_child="false"
          if [ "$sub_count" != "0" ]; then
            for child_num in $(echo "$sub_issues_json" | jq -r '.[].number'); do
              child_sub_count=$(gh api "repos/${GH_REPO}/issues/${child_num}/sub_issues" --jq 'length' 2>/dev/null || echo "0")
              if [ "$child_sub_count" != "0" ]; then
                has_nested_child="true"
                echo "nested_child_number=$child_num" >> "$GITHUB_OUTPUT"
                break
              fi
            done
          fi

          # First still-open sub-issue, in the order returned by the sub-issues API.
          next_open=$(echo "$sub_issues_json" | jq -r '[.[] | select(.state == "open")] | .[0] // empty')
          next_open_number=""
          next_open_title=""
          if [ -n "$next_open" ]; then
            next_open_number=$(echo "$next_open" | jq -r '.number')
            next_open_title=$(echo "$next_open" | jq -r '.title')
          fi

          # Decide mode.
          if [ "$sub_count" = "0" ]; then
            mode="silent"
          elif [ "$nested" = "true" ]; then
            mode="refuse-nested-prd"
          elif [ "$has_nested_child" = "true" ]; then
            mode="refuse-nested-child"
          elif [ -z "$next_open_number" ]; then
            mode="refuse-all-closed"
          else
            mode="run"
          fi

          echo "sub_count=$sub_count" >> "$GITHUB_OUTPUT"
          echo "parent_number=$parent_number" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "next_open_number=$next_open_number" >> "$GITHUB_OUTPUT"
          {
            echo "next_open_title<<EOF"
            echo "$next_open_title"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse — nested PRD
        if: steps.shape.outputs.mode == 'refuse-nested-prd'
        env:
          PARENT_NUMBER: ${{ steps.shape.outputs.parent_number }}
        run: |
          gh issue edit "$PRD_NUMBER" --remove-label "agent:implement-prd" || true
          gh issue edit "$PRD_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$PRD_NUMBER" --body "Refused to run: this issue has sub-issues but is itself a sub-issue of #${PARENT_NUMBER}. Nested PRDs are not supported. Flatten the structure before retrying."

      - name: Refuse — sub-issue has its own sub-issues
        if: steps.shape.outputs.mode == 'refuse-nested-child'
        env:
          NESTED_CHILD: ${{ steps.shape.outputs.nested_child_number }}
        run: |
          gh issue edit "$PRD_NUMBER" --remove-label "agent:implement-prd" || true
          gh issue edit "$PRD_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$PRD_NUMBER" --body "Refused to run: sub-issue #${NESTED_CHILD} itself has sub-issues. Nested sub-issues are not supported — each sub-issue must be a leaf. Flatten the structure before retrying."

      - name: Refuse — all sub-issues already closed
        if: steps.shape.outputs.mode == 'refuse-all-closed'
        run: |
          gh issue edit "$PRD_NUMBER" --remove-label "agent:implement-prd" || true
          gh issue edit "$PRD_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$PRD_NUMBER" --body "Refused to run: all sub-issues are already closed; nothing to implement. If you want to do more work on this PRD, reopen or add a sub-issue first."

      - name: Checkout workflow actions
        if: steps.shape.outputs.mode == 'run'
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Proxy preflight
        if: steps.shape.outputs.mode == 'run'
        id: proxy-preflight
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash .sandcastle/scripts/proxy_preflight.sh

      - name: Sandcastle setup
        if: steps.shape.outputs.mode == 'run'
        uses: ./.github/actions/sandcastle-setup
        with:
          trigger-label: agent:implement-prd
          object-type: issue
          object-number: ${{ env.PRD_NUMBER }}
          checkout-ref: dev
          checkout-fetch-depth: 0
          skip-checkout: ${{ steps.proxy-preflight.outputs.should_run != 'true' }}
          install-engine: ${{ steps.proxy-preflight.outputs.should_run }}
          checkout-token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Stop when proxy preflight skips
        if: steps.shape.outputs.mode == 'run' && steps.proxy-preflight.outputs.should_run != 'true'
        run: |
          echo "Proxy preflight skipped agent run: ${{ steps.proxy-preflight.outputs.reason }}. ${{ steps.proxy-preflight.outputs.detail }}" > "${RUNNER_TEMP}/failure_reason.txt"
          exit 1

      - name: Compute branch name
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run'
        id: branch
        run: |
          set -euo pipefail
          slug=$(echo "$PRD_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
            | cut -c1-50)
          branch="agent/prd-${PRD_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up git identity and resume/create branch
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run'
        id: branchstate
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "is_first=false" >> "$GITHUB_OUTPUT"
          else
            git checkout -b "$BRANCH"
            echo "is_first=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run implement-prd
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run'
        id: implement
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts implement-prd \
            --prd-number "$PRD_NUMBER" \
            --prd-title "$PRD_TITLE" \
            --sub-issue-number "${{ steps.shape.outputs.next_open_number }}" \
            --sub-issue-title "${{ steps.shape.outputs.next_open_title }}" \
            --branch "$BRANCH"

      - name: Push branch
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push origin "$BRANCH"

      - name: Check whether a PR already exists for this branch
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run' && success()
        id: pr_lookup
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          existing_pr=$(gh pr list -R "$GH_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "existing_pr=$existing_pr" >> "$GITHUB_OUTPUT"

      - name: Write PR title and description (only when opening a new PR)
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run' && success() && steps.pr_lookup.outputs.existing_pr == ''
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts write-prd-pr \
            --prd-number "$PRD_NUMBER" \
            --prd-title "$PRD_TITLE"

      - name: Open draft PR if one doesn't exist for this branch
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run' && success()
        id: open_pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          EXISTING_PR: ${{ steps.pr_lookup.outputs.existing_pr }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_PR" ]; then
            echo "pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            PR_TITLE=$(cat "${RUNNER_TEMP}/pr_title.txt")
            PR_TITLE="${PR_TITLE:0:256}"
            pr_url=$(gh pr create \
              -R "$GH_REPO" \
              --draft \
              --base dev \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body-file "${RUNNER_TEMP}/pr_description.txt" | tail -n1)
            pr_number=$(basename "$pr_url")
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close completed sub-issue
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run' && success()
        env:
          SUB_ISSUE_NUMBER: ${{ steps.shape.outputs.next_open_number }}
        run: |
          commit_sha=$(git rev-parse HEAD)
          gh issue close "$SUB_ISSUE_NUMBER" --comment "Implemented in ${commit_sha}. Part of #${PRD_NUMBER}."

      - name: Re-check remaining open sub-issues
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run' && success()
        id: remaining
        env:
          SUB_ISSUE_NUMBER: ${{ steps.shape.outputs.next_open_number }}
        run: |
          set -euo pipefail
          if remaining=$(gh api "repos/${GH_REPO}/issues/${PRD_NUMBER}/sub_issues" \
            --jq '[.[] | select(.state == "open" and (.number | tostring) != env.SUB_ISSUE_NUMBER)] | length'); then
            echo "count=$remaining" >> "$GITHUB_OUTPUT"
          else
            status=$?
            echo "Failed to re-check remaining open sub-issues (status $status)." > "${RUNNER_TEMP}/failure_reason.txt"
            exit "$status"
          fi

      - name: Chain — re-label PRD to pick up next sub-issue
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run' && success() && steps.remaining.outputs.count != '0'
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$AGENT_PAT" ]; then
            echo "AGENT_PAT is required to add agent:implement-prd because GITHUB_TOKEN-created labels do not trigger workflows." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi
          GH_TOKEN="$AGENT_PAT" gh issue edit "$PRD_NUMBER" --add-label "agent:implement-prd" || {
            status=$?
            echo "AGENT_PAT failed to add agent:implement-prd (status $status)." > "${RUNNER_TEMP}/failure_reason.txt"
            exit "$status"
          }

      - name: Hand off — mark PR ready for Copilot review
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run' && success() && steps.remaining.outputs.count == '0'
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if is_draft=$(gh pr view "$PR_NUMBER" -R "$GH_REPO" --json isDraft --jq '.isDraft'); then
            :
          else
            status=$?
            echo "Failed to determine draft state for PR #${PR_NUMBER} (status $status)." > "${RUNNER_TEMP}/failure_reason.txt"
            exit "$status"
          fi
          if [ "$is_draft" != "true" ]; then
            echo "PR #${PR_NUMBER} is already ready for review."
            exit 0
          fi
          if [ -z "$AGENT_PAT" ]; then
            echo "AGENT_PAT is required to mark the PR ready because GITHUB_TOKEN-created ready_for_review events do not trigger workflows." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi
          GH_TOKEN="$AGENT_PAT" gh pr ready -R "$GH_REPO" "$PR_NUMBER" || {
            status=$?
            echo "AGENT_PAT failed to mark PR #${PR_NUMBER} ready for review (status $status)." > "${RUNNER_TEMP}/failure_reason.txt"
            exit "$status"
          }

      - name: Comment on failed sub-issue
        if: steps.proxy-preflight.outputs.should_run == 'true' && steps.shape.outputs.mode == 'run' && failure() && steps.shape.outputs.next_open_number != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUB_ISSUE_NUMBER: ${{ steps.shape.outputs.next_open_number }}
        run: |
          gh issue comment "$SUB_ISSUE_NUMBER" --body "Implementation attempt failed. See PRD #${PRD_NUMBER} for status. Workflow run: $RUN_URL" || true

      - name: Restore workflow actions
        if: always() && steps.shape.outputs.mode == 'run'
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Sandcastle teardown
        if: always() && steps.shape.outputs.mode == 'run'
        uses: ./.github/actions/sandcastle-teardown
        with:
          trigger-label: agent:implement-prd
          object-type: issue
          object-number: ${{ env.PRD_NUMBER }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          job-status: ${{ job.status }}
          failure-context: "${{ steps.shape.outputs.next_open_number != '' && format('while implementing sub-issue #{0}', steps.shape.outputs.next_open_number) || '' }}"
