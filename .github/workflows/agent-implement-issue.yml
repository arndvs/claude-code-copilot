name: "Agent: Implement Issue"

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sandcastle-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}

    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Proxy preflight
        id: proxy-preflight
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash .sandcastle/scripts/proxy_preflight.sh

      - name: Sandcastle setup
        uses: ./.github/actions/sandcastle-setup
        with:
          trigger-label: agent:implement
          object-type: issue
          object-number: ${{ env.ISSUE_NUMBER }}
          checkout-ref: dev
          checkout-fetch-depth: 0
          skip-checkout: ${{ steps.proxy-preflight.outputs.should_run != 'true' }}
          install-engine: ${{ steps.proxy-preflight.outputs.should_run }}
          checkout-token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Stop when proxy preflight skips
        if: steps.proxy-preflight.outputs.should_run != 'true'
        run: |
          echo "Proxy preflight skipped agent run: ${{ steps.proxy-preflight.outputs.reason }}. ${{ steps.proxy-preflight.outputs.detail }}" > "${RUNNER_TEMP}/failure_reason.txt"
          exit 1

      - name: Compute branch name
        if: steps.proxy-preflight.outputs.should_run == 'true'
        id: branch
        run: |
          set -euo pipefail
          slug=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
            | cut -c1-50)
          branch="agent/issue-${ISSUE_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up git identity and branch
        if: steps.proxy-preflight.outputs.should_run == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "claude-code[bot]"
          git config user.email "claude-code[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Run implement
        if: steps.proxy-preflight.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts implement-issue \
            --issue "$ISSUE_NUMBER" \
            --issue-title "$ISSUE_TITLE" \
            --branch "$BRANCH"

      - name: Push branch
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push origin "$BRANCH"

      - name: Write PR title and description
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts write-pr \
            --issue "$ISSUE_NUMBER" \
            --issue-title "$ISSUE_TITLE" \
            --branch "$BRANCH"

      - name: Open draft PR
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        id: open_pr
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          existing_pr=$(gh pr list -R ${{ github.repository }} --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "PR #${existing_pr} already exists for $BRANCH"
            echo "pr_number=$existing_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_TITLE=$(cat "${RUNNER_TEMP}/pr_title.txt")
          PR_TITLE="${PR_TITLE:0:256}"
          pr_url=$(gh pr create \
            -R ${{ github.repository }} \
            --draft \
            --base dev \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body-file "${RUNNER_TEMP}/pr_description.txt" | tail -n1)
          pr_number=$(basename "$pr_url")
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Transition label
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --add-label "agent:pr-open" \
            -R ${{ github.repository }}

      - name: Hand off — mark PR ready for Copilot review
        if: steps.proxy-preflight.outputs.should_run == 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if is_draft=$(gh pr view "$PR_NUMBER" -R ${{ github.repository }} --json isDraft --jq '.isDraft'); then
            :
          else
            status=$?
            echo "Failed to determine draft state for PR #${PR_NUMBER} (status $status)." > "${RUNNER_TEMP}/failure_reason.txt"
            exit "$status"
          fi
          if [ "$is_draft" != "true" ]; then
            echo "PR #${PR_NUMBER} is already ready for review."
            exit 0
          fi
          if [ -z "$AGENT_PAT" ]; then
            echo "AGENT_PAT is required to mark the PR ready because GITHUB_TOKEN-created ready_for_review events do not trigger workflows." > "${RUNNER_TEMP}/failure_reason.txt"
            exit 1
          fi
          GH_TOKEN="$AGENT_PAT" gh pr ready -R ${{ github.repository }} "$PR_NUMBER" || {
            status=$?
            echo "AGENT_PAT failed to mark PR #${PR_NUMBER} ready for review (status $status)." > "${RUNNER_TEMP}/failure_reason.txt"
            exit "$status"
          }

      - name: Restore workflow actions
        if: always()
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Sandcastle teardown
        if: always()
        uses: ./.github/actions/sandcastle-teardown
        with:
          trigger-label: agent:implement
          object-type: issue
          object-number: ${{ env.ISSUE_NUMBER }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          job-status: ${{ job.status }}
