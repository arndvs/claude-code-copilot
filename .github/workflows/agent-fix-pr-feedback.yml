name: "Agent: Fix PR Feedback"

on:
  pull_request_target:
    types: [labeled]

jobs:
  refuse-fork:
    if: github.event.label.name == 'agent:fix' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Block unsafe fork execution
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:fix" -R ${{ github.repository }} || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" -R ${{ github.repository }} || true
          gh pr comment "$PR_NUMBER" -R ${{ github.repository }} --body "Refused to run \`agent:fix\`: this workflow uses \`pull_request_target\` and cannot safely execute agent code for fork PRs. Recreate the PR from a branch in this repository, or address feedback manually."

  refuse-non-owner:
    if: github.event.label.name == 'agent:fix' && github.event.pull_request.head.repo.full_name == github.repository && !contains(fromJSON('["OWNER","MEMBER"]'), github.event.sender.type)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Block non-owner execution
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:fix" -R ${{ github.repository }} || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" -R ${{ github.repository }} || true
          gh pr comment "$PR_NUMBER" -R ${{ github.repository }} --body "Refused to run \`agent:fix\`: only repository OWNER or MEMBER can trigger this workflow. Re-apply the label from an authorized account."

  fix-feedback:
    if: github.event.label.name == 'agent:fix' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER"]'), github.event.sender.type)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: sandcastle-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Fetch PR head sandcastle.config.json
        id: fetch-pr-head-config
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${{ github.repository }}/contents/sandcastle.config.json?ref=${{ github.event.pull_request.head.sha }}" \
            > "$RUNNER_TEMP/pr-head-sandcastle.config.json" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/pr-head-sandcastle.config.json" ]; then
            echo "config_path=$RUNNER_TEMP/pr-head-sandcastle.config.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Proxy preflight
        id: proxy-preflight
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANDCASTLE_CONFIG_PATH: ${{ steps.fetch-pr-head-config.outputs.config_path }}
        run: bash .sandcastle/scripts/proxy_preflight.sh

      - name: Sandcastle setup
        uses: ./.github/actions/sandcastle-setup
        with:
          trigger-label: agent:fix
          object-type: pr
          object-number: ${{ env.PR_NUMBER }}
          checkout-ref: ${{ github.event.pull_request.head.ref }}
          skip-checkout: ${{ steps.proxy-preflight.outputs.should_run != 'true' }}
          install-engine: ${{ steps.proxy-preflight.outputs.should_run }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Stop when proxy preflight skips
        if: steps.proxy-preflight.outputs.should_run != 'true'
        env:
          PREFLIGHT_REASON: ${{ steps.proxy-preflight.outputs.reason }}
          PREFLIGHT_DETAIL: ${{ steps.proxy-preflight.outputs.detail }}
        run: |
          echo "Proxy preflight skipped agent run: ${PREFLIGHT_REASON}. ${PREFLIGHT_DETAIL}" > "${RUNNER_TEMP}/failure_reason.txt"
          exit 1

      - name: Run fix feedback
        if: steps.proxy-preflight.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.LITELLM_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd .sandcastle/engine
          pnpm --ignore-workspace exec tsx ../run.ts fix-pr-feedback \
            --pr ${{ github.event.pull_request.number }}

      - name: Restore workflow actions
        if: always()
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Sandcastle teardown
        if: always()
        uses: ./.github/actions/sandcastle-teardown
        with:
          trigger-label: agent:fix
          object-type: pr
          object-number: ${{ env.PR_NUMBER }}
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          job-status: ${{ job.status }}
