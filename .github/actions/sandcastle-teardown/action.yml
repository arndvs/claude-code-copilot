name: Sandcastle teardown
description: Shared post-run cleanup for Sandcastle agent workflows.
inputs:
  trigger-label:
    description: Pipeline label to mention when reporting failure/retry guidance.
    required: true
  object-type:
    description: GitHub object type that carries lifecycle labels.
    required: true
  object-number:
    description: Issue or PR number that carries lifecycle labels.
    required: true
  token:
    description: Token used to update labels.
    required: true
  repository:
    description: GitHub repository, owner/name.
    required: true
  run-url:
    description: URL for the current workflow run.
    required: true
  job-status:
    description: Caller job status supplied by the workflow.
    required: true
  failure-context:
    description: Optional context appended to the failure summary.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Remove trigger label
      if: always()
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        gh "${{ inputs['object-type'] }}" edit "${{ inputs['object-number'] }}" --remove-label "${{ inputs['trigger-label'] }}" -R "${{ inputs.repository }}" || true

    - name: Mark blocked on failure
      if: ${{ inputs['job-status'] == 'failure' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        RUN_URL: ${{ inputs['run-url'] }}
        FAILURE_CONTEXT: ${{ inputs['failure-context'] }}
      run: |
        reason="(no reason file written — check workflow logs)"
        if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
          reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
        fi
        context="$FAILURE_CONTEXT"
        if [ -n "$context" ]; then
          context=" $context"
        fi
        gh "${{ inputs['object-type'] }}" edit "${{ inputs['object-number'] }}" --add-label "agent:blocked" -R "${{ inputs.repository }}" || true
        gh "${{ inputs['object-type'] }}" comment "${{ inputs['object-number'] }}" -R "${{ inputs.repository }}" --body "$(cat <<EOF
        \`${{ inputs['trigger-label'] }}\` run failed${context}.
        **Reason:** $reason
        **Workflow run:** $RUN_URL
        Re-add \`${{ inputs['trigger-label'] }}\` to retry.
        EOF
        )" || true

    - name: Remove in-progress label
      if: always()
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        gh "${{ inputs['object-type'] }}" edit "${{ inputs['object-number'] }}" --remove-label "agent:in-progress" -R "${{ inputs.repository }}" || true
